# Caller template for a Go repository: gate + workflow lint.
# Copy to .github/workflows/ci.yml and adjust the `with:` block.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: IronFlock/workflows/.github/workflows/go-gate.yml@v1
    with:
      working-directory: .
      targets-file: targets

  workflows:
    uses: IronFlock/workflows/.github/workflows/workflows-lint.yml@v1

  # The one required check of the main-branch ruleset: green only when every
  # job above succeeded (skipped or cancelled counts as failed).
  ci-ok:
    if: ${{ always() }}
    needs: [gate, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all ci jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

