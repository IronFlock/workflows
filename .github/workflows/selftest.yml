# Self-test of the harness. Runs the reusable workflows at this commit against
# the fixtures in tests/fixtures:
#   positive controls  go-pass passes the gate and the scan with every fail-on
#                      category set; node-pass-npm / node-pass-bun pass the node
#                      gate; python-pass passes the python gate; shell-pass
#                      passes the shell gate and its build output reaches a
#                      later job; this repository's own workflows lint clean
#   negative controls  planted findings (fake key, reachable vulnerable call,
#                      secret logged to the console, root container, unpinned
#                      action, failing Go, Node, Python and bats tests, an
#                      unquoted shell expansion, a second or missing
#                      lockfile, a privileged container in a Helm chart, an
#                      outdated package in a built root filesystem) are each
#                      reported; a Helm chart trivy skips and a root tree
#                      without an operating system fail the scan
# Negative controls run report-only and are asserted from the outputs, so the
# self-test is green exactly when every planted finding is detected.
# `v1` is advanced only to a commit whose self-test is green.
name: selftest

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly: scanner databases and rule sets change without a commit here.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint-self:
    uses: ./.github/workflows/workflows-lint.yml
    with:
      harness-ref: ${{ github.sha }}

  lint-templates:
    uses: ./.github/workflows/workflows-lint.yml
    with:
      path: templates/workflows
      harness-ref: ${{ github.sha }}

  lint-planted:
    uses: ./.github/workflows/workflows-lint.yml
    with:
      path: tests/fixtures/workflows-bad/.github/workflows
      report-only: true
      harness-ref: ${{ github.sha }}

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-tool.sh shellcheck
      - name: helm from tools.lock
        run: |
          scripts/install-tool.sh helm
          "$RUNNER_TEMP/bin/helm" version --short | grep -q '^v3\.22\.0'
      - name: shellcheck
        run: shellcheck scripts/*.sh
      # The workflows run the scripts directly ("$HARNESS/scripts/<name>"): one
      # committed without the executable bit fails a release with "Permission
      # denied". Tests run through bash or python3 and may stay as they are.
      - name: every script the workflows run is executable
        run: |
          bad=$(git ls-files -s scripts | awk '$1 != "100755" && $4 !~ /^scripts\/test_/ { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::not executable in git (git update-index --chmod=+x <file>): $bad"
            exit 1
          fi
      - name: sarif-summary unit tests
        run: python3 -I scripts/test_sarif_summary.py
      - name: release.sh unit tests
        run: bash scripts/test_release.sh
      - name: pr.sh unit tests
        run: bash scripts/test_pr.sh
      - name: publish.sh unit tests
        run: bash scripts/test_publish.sh
      - name: sign-provenance.sh check unit tests
        run: bash scripts/test_sign_provenance.sh
      - name: tools.lock has every tool for x86_64 and arm64
        run: bash scripts/test_tools_lock.sh
      # Public repository: no internal document names or plan IDs.
      - name: public-repo hygiene
        run: |
          if git grep -n -I -E 'INTERNAL-|WP-[0-9]{2}(-[0-9]{2})?\b' -- . ':!.github/workflows/selftest.yml'; then
            echo "::error::internal references found"
            exit 1
          fi

  # Every tool of tools.lock installs on an arm64 runner as an arm64 binary
  # and runs.
  tools-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install every tool
        run: |
          mapfile -t tools < <(awk '!/^#/ && NF && $1 !~ /\// { print $1 }' tools.lock)
          scripts/install-tool.sh "${tools[@]}"
      - name: each is an arm64 binary and runs
        run: |
          fail=0
          while read -r tool args; do
            bin=$RUNNER_TEMP/bin/$tool
            if ! file -L "$bin" | grep -q 'ARM aarch64'; then
              echo "::error::$tool is not an arm64 binary: $(file -L "$bin")"
              fail=1
              continue
            fi
            # shellcheck disable=SC2086 # the arguments are space-separated words
            if out=$("$bin" $args 2>&1); then
              echo "$tool: $(echo "$out" | head -n 1)"
            else
              echo "::error::$tool $args failed: $out"
              fail=1
            fi
          done <<'TOOLS'
          gitleaks version
          trivy --version
          osv-scanner --version
          actionlint -version
          zizmor --version
          pinact --version
          shellcheck --version
          shfmt --version
          just --version
          kubeconform -v
          helm version --short
          bun --version
          uv --version
          uvx --version
          cosign version
          TOOLS
          exit "$fail"

  # The shell gate's native arm64 build (build-runs-on), as an image builder
  # for arm64 targets uses it.
  shell-gate-arm64:
    uses: ./.github/workflows/shell-gate.yml
    with:
      working-directory: tests/fixtures/shell-pass
      skip: lint,unit
      build-args: out
      build-runs-on: ubuntu-24.04-arm
      harness-ref: ${{ github.sha }}

  # The release signer callers run from their harness checkout
  # (tools/sign-openpgp): its tests sign with a development key and check the
  # signatures with gpgv, as an appliance or device does.
  sign-openpgp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/sign-openpgp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/sign-openpgp/go.mod
          cache: false
      - name: gofmt, go mod tidy, go vet
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go vet ./...
      - name: unit tests
        run: |
          command -v gpgv
          go test -race -count=1 ./...

  gate-pass:
    uses: ./.github/workflows/go-gate.yml
    with:
      working-directory: tests/fixtures/go-pass
      go-version: stable
      targets: |
        linux/amd64
        linux/arm64
        linux/arm/7
        windows/amd64
        darwin/arm64
      harness-ref: ${{ github.sha }}

  gate-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: scripts/install-tool.sh just
      - name: the planted failing test must fail `just test`
        working-directory: tests/fixtures/go-fail
        run: |
          if just test; then
            echo "::error::just test passed although a test fails"
            exit 1
          fi
          echo "just test failed as expected"

  node-gate-npm:
    uses: ./.github/workflows/node-gate.yml
    with:
      package-manager: npm
      working-directory: tests/fixtures/node-pass-npm
      harness-ref: ${{ github.sha }}

  # An npm repository whose tests need an extra tool (bun) from tools.lock.
  node-gate-npm-tools:
    uses: ./.github/workflows/node-gate.yml
    with:
      package-manager: npm
      working-directory: tests/fixtures/node-pass-npm
      tools: bun
      test-recipe: test-with-tool
      harness-ref: ${{ github.sha }}

  node-gate-bun:
    uses: ./.github/workflows/node-gate.yml
    with:
      package-manager: bun
      working-directory: tests/fixtures/node-pass-bun
      harness-ref: ${{ github.sha }}

  node-gate-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: scripts/install-tool.sh just
      - name: the planted failing test must fail `just test`
        working-directory: tests/fixtures/node-fail
        run: |
          ../../../scripts/node-setup.sh install npm
          if just test; then
            echo "::error::just test passed although a test fails"
            exit 1
          fi
          echo "just test failed as expected"
      - name: a second lockfile and a missing lockfile must fail the check
        run: |
          work=$(mktemp -d)
          cp tests/fixtures/node-fail/package.json tests/fixtures/node-fail/package-lock.json tests/fixtures/node-pass-bun/bun.lock "$work/"
          if (cd "$work" && "$GITHUB_WORKSPACE/scripts/node-setup.sh" check-lockfile npm); then
            echo "::error::bun.lock next to package-lock.json was accepted"
            exit 1
          fi
          if (cd tests/fixtures/node-pass-npm && "$GITHUB_WORKSPACE/scripts/node-setup.sh" check-lockfile bun); then
            echo "::error::a missing bun.lock was accepted"
            exit 1
          fi
          echo "lockfile checks failed as expected"

  python-gate-pass:
    uses: ./.github/workflows/python-gate.yml
    with:
      working-directory: tests/fixtures/python-pass
      harness-ref: ${{ github.sha }}

  python-gate-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: scripts/install-tool.sh just uv uvx
      - name: the planted failing test must fail `just test`
        working-directory: tests/fixtures/python-fail
        run: |
          uv sync --frozen
          if just test; then
            echo "::error::just test passed although a test fails"
            exit 1
          fi
          echo "just test failed as expected"

  shell-gate-pass:
    uses: ./.github/workflows/shell-gate.yml
    with:
      working-directory: tests/fixtures/shell-pass
      build-args: out
      build-artifact-path: tests/fixtures/shell-pass/out/greeting.txt
      build-artifact-name: shell-gate-selftest
      build-artifact-retention-days: 1
      harness-ref: ${{ github.sha }}

  # The build output of the gate must reach a later job of the caller (an
  # image test, a release): the artifact is downloaded and checked here.
  shell-gate-artifact:
    needs: [shell-gate-pass]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shell-gate-selftest
          path: out
      - name: the build output reached this job
        run: grep -qx 'hello world' out/greeting.txt

  shell-gate-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-tool.sh just shellcheck shfmt
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bats bats-support bats-assert
      - name: the planted findings must fail `just lint` and `just test`
        working-directory: tests/fixtures/shell-fail
        run: |
          fail=0
          if just lint; then
            echo "::error::just lint passed although greet.sh has an unquoted expansion"
            fail=1
          fi
          if just test; then
            echo "::error::just test passed although a bats test fails"
            fail=1
          fi
          [ "$fail" = 0 ] && echo "just lint and just test failed as expected"
          exit "$fail"

  security-clean:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: tests/fixtures/go-pass
      scan-path: tests/fixtures/go-pass
      artifact-prefix: clean
      languages: go
      go-version: stable
      gitleaks-mode: dir
      fail-on: secrets,vuln-critical,vuln-high,misconfig-high,license-forbidden,semgrep-error
      code-scanning: false
      # Weekly too: every scanner, not only the dependency and image scans.
      scheduled-full: true
      harness-ref: ${{ github.sha }}

  # The Node path of the scan (osv-scanner on the lockfile, trivy SBOM) on a
  # clean npm fixture: must pass with every fail-on category set.
  security-clean-node:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: tests/fixtures/node-pass-npm
      scan-path: tests/fixtures/node-pass-npm
      artifact-prefix: clean-node
      languages: node
      gitleaks-mode: dir
      fail-on: secrets,vuln-critical,vuln-high,misconfig-high,license-forbidden,semgrep-error
      code-scanning: false
      # Weekly too: every scanner, not only the dependency and image scans.
      scheduled-full: true
      harness-ref: ${{ github.sha }}

  security-planted:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: tests/fixtures/planted
      scan-path: tests/fixtures/planted
      artifact-prefix: planted
      languages: go
      go-version: stable
      gitleaks-mode: dir
      image: true
      dockerfile: tests/fixtures/planted/Dockerfile
      context: tests/fixtures/planted
      image-on: pull_request,push,schedule,workflow_dispatch
      code-scanning: false
      # Weekly too: every scanner, not only the dependency and image scans.
      scheduled-full: true
      harness-ref: ${{ github.sha }}

  # A chart whose dependency is not committed: trivy skips the whole chart,
  # so the configuration scan must fail instead of reporting it clean.
  config-scan-skipped-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-tool.sh trivy
      # Output captured: the expected ::error:: lines are not annotations here.
      - name: the skipped chart must fail trivy-config.sh
        run: |
          if out=$(scripts/trivy-config.sh tests/fixtures/helm "$RUNNER_TEMP/skipped.sarif" 2>&1); then
            echo "::error::trivy-config.sh passed although trivy skipped the chart"
            exit 1
          fi
          if ! grep -q 'trivy skipped a Helm chart' <<<"$out"; then
            echo "$out"
            echo "::error::trivy-config.sh failed, but not on the skipped chart"
            exit 1
          fi
          echo "trivy-config.sh failed on the skipped chart as expected"

  # The same chart with config-setup-recipe fetching the dependency: the
  # planted privileged container, which only the rendered chart shows, must be
  # reported.
  security-helm:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: tests/fixtures/helm
      scan-path: tests/fixtures/helm
      artifact-prefix: helm
      gitleaks: false
      semgrep: false
      licenses: false
      config-setup-recipe: deps
      config-tools: helm
      code-scanning: false
      # Weekly too: every scanner, not only the dependency and image scans.
      scheduled-full: true
      harness-ref: ${{ github.sha }}

  # The root filesystem scan: the fixture recipe leaves the tree of an
  # outdated base image, readable by root only, natively on an x64 and an
  # arm64 runner. Its fixed vulnerability and both SBOMs are checked in
  # assert-planted.
  security-rootfs:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      working-directory: tests/fixtures/rootfs
      artifact-prefix: rootfs
      gitleaks: false
      semgrep: false
      config-scan: false
      licenses: false
      rootfs-recipe: rootfs
      rootfs-matrix: >-
        [{"name": "alpine-amd64", "args": "alpine-amd64 alpine:3.12", "path": "alpine-amd64"},
        {"name": "alpine-arm64", "args": "alpine-arm64 alpine:3.12", "path": "alpine-arm64", "runner": "ubuntu-24.04-arm"}]
      code-scanning: false
      harness-ref: ${{ github.sha }}

  # A tree without an operating system (a wrong path, a build that stopped
  # early): trivy scans it without an error, so the rootfs scan must fail
  # instead of reporting it clean.
  rootfs-scan-empty-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-tool.sh trivy
      # Output captured: the expected ::error:: line is not an annotation here.
      - name: the empty tree must fail trivy-rootfs.sh
        run: |
          mkdir -p "$RUNNER_TEMP/empty"
          if out=$(scripts/trivy-rootfs.sh "$RUNNER_TEMP/empty" "$RUNNER_TEMP/empty.sarif" "$RUNNER_TEMP/empty.cdx.json" 2>&1); then
            echo "::error::trivy-rootfs.sh passed although the tree has no operating system"
            exit 1
          fi
          if ! grep -q 'no operating system with packages' <<<"$out"; then
            echo "$out"
            echo "::error::trivy-rootfs.sh failed, but not on the missing operating system"
            exit 1
          fi
          echo "trivy-rootfs.sh failed on the empty tree as expected"

  # Dry run of the release workflow (not the merge of a release pull request:
  # builds both platforms natively, pushes nothing, needs no credentials).
  # The decisions of a real release (merge title, existing tag, re-run) are
  # covered by the release.sh unit tests in `scripts`.
  release-dry-run:
    uses: ./.github/workflows/release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      image: example.invalid/selftest/release
      version-file: tests/fixtures/release/version.txt
      dockerfile: tests/fixtures/release/Dockerfile
      context: tests/fixtures/release
      build-args: VERSION={tag}
      workload-identity-provider: dry-run-unused
      service-account: dry-run-unused
      artifact-prefix: version-file-
      harness-ref: ${{ github.sha }}

  # The version of a Node repository lives in package.json.
  release-dry-run-package-json:
    uses: ./.github/workflows/release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      image: example.invalid/selftest/release
      version-file: tests/fixtures/node-pass-npm/package.json
      dockerfile: tests/fixtures/release/Dockerfile
      context: tests/fixtures/release
      build-args: VERSION={tag}
      workload-identity-provider: dry-run-unused
      service-account: dry-run-unused
      artifact-prefix: package-json-
      harness-ref: ${{ github.sha }}

  # A second release project in a repository: git tag db-v<version>, image tag
  # v<version>.
  release-dry-run-image-tag:
    uses: ./.github/workflows/release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      image: example.invalid/selftest/release
      version-file: tests/fixtures/release/version.txt
      tag-prefix: db-v
      image-tag-prefix: v
      dockerfile: tests/fixtures/release/Dockerfile
      context: tests/fixtures/release
      build-args: VERSION={tag}
      workload-identity-provider: dry-run-unused
      service-account: dry-run-unused
      artifact-prefix: image-tag-
      harness-ref: ${{ github.sha }}

  assert-image-tag:
    needs: [release-dry-run-image-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: git tag db-v0.0.1, image tag v0.0.1
        env:
          TAG: ${{ needs.release-dry-run-image-tag.outputs.tag }}
          IMAGE_TAG: ${{ needs.release-dry-run-image-tag.outputs.image-tag }}
        run: |
          echo "tag $TAG, image tag $IMAGE_TAG"
          [ "$TAG" = db-v0.0.1 ] && [ "$IMAGE_TAG" = v0.0.1 ]

  # A named build context from an artifact of the same run.
  build-context-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: mkdir -p ctx/extra && echo "from the artifact" > ctx/extra/marker.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-build-contexts
          path: ctx
          retention-days: 1

  release-dry-run-build-context:
    needs: [build-context-artifact]
    uses: ./.github/workflows/release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      image: example.invalid/selftest/release
      version-file: tests/fixtures/release/version.txt
      dockerfile: tests/fixtures/release/Dockerfile.context
      context: tests/fixtures/release
      build-contexts-artifact: selftest-build-contexts
      workload-identity-provider: dry-run-unused
      service-account: dry-run-unused
      artifact-prefix: build-context-
      harness-ref: ${{ github.sha }}

  # The publish job's provenance signing (sign-provenance.sh sign) end to end:
  # a two-platform index with BuildKit provenance in a throwaway registry,
  # signed with throwaway cosign key files in place of the KMS key; refusal,
  # re-run and another key's attestation included.
  provenance-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      registry:
        image: registry:3@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-tool.sh cosign
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder reaches the registry service on localhost.
          driver-opts: network=host
      - name: sign, verify, re-run, refuse
        run: bash scripts/test_sign_provenance_registry.sh localhost:5000

  # The signing account of release-image.yml is granted only to a token whose
  # `environment` claim is image-provenance, which its publish job gets from
  # `environment: { name: image-provenance, deployment: false }`. This job is
  # set up the same way and checks that the claim is there, so a change on
  # GitHub's side fails here, not in a release.
  provenance-environment-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: image-provenance
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: the job's OIDC token names the environment
        run: |
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ironflock-selftest" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while [ $((${#payload} % 4)) != 0 ]; do payload+="="; done
          environment=$(base64 -d <<<"$payload" | jq -r '.environment // empty')
          echo "environment claim: '$environment'"
          [ "$environment" = image-provenance ] || { echo "::error::no environment claim image-provenance with deployment: false; release-image.yml could not sign"; exit 1; }

  # attest-provenance.yml as a dry run: a real one would write to the public
  # transparency log on every pull request.
  attest-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: mkdir -p out/one && echo image > out/one/one.img.gz && echo bundle > out/one/one.raucb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-attest
          path: out
          retention-days: 1

  attest-dry-run:
    needs: [attest-fixture]
    uses: ./.github/workflows/attest-provenance.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      artifact: selftest-attest
      subject-path: |
        */*.img.gz
        */*.raucb
      dry-run: true

  assert-planted:
    needs: [security-planted, security-helm, security-rootfs, lint-planted]
    # Also when a scanner job broke: the counts then show what is missing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every planted finding was reported
        env:
          FINDINGS: ${{ needs.security-planted.outputs.findings }}
          HELM: ${{ needs.security-helm.outputs.findings }}
          ROOTFS: ${{ needs.security-rootfs.outputs.findings }}
          LINT: ${{ needs.lint-planted.outputs.findings }}
        run: |
          echo "security: $FINDINGS"
          echo "security (helm): $HELM"
          echo "security (rootfs): $ROOTFS"
          echo "workflow lint: $LINT"
          fail=0
          for cat in secrets vuln-high misconfig-high semgrep-error; do
            n=$(jq -r --arg c "$cat" '.[$c] // 0' <<<"$FINDINGS")
            if [ "$n" -lt 1 ]; then echo "::error::no $cat finding in the planted fixture"; fail=1; fi
          done
          if [ "$(jq -r '.["misconfig-high"] // 0' <<<"$HELM")" -lt 1 ]; then
            echo "::error::no misconfig-high finding in the planted Helm chart"; fail=1
          fi
          if [ "$(jq -r '(.["vuln-critical"] // 0) + (.["vuln-high"] // 0)' <<<"$ROOTFS")" -lt 1 ]; then
            echo "::error::no vuln-critical or vuln-high finding in the planted root trees"; fail=1
          fi
          for tool in zizmor pinact; do
            if [ "$(jq -r --arg t "$tool" '.[$t] // 0' <<<"$LINT")" != 1 ]; then
              echo "::error::$tool did not flag the planted workflow"; fail=1
            fi
          done
          exit "$fail"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rootfs-rootfs-sbom-*
          path: sbom
      - name: an SBOM per root tree, each of its runner's architecture
        run: |
          fail=0
          for entry in alpine-amd64:x86_64 alpine-arm64:aarch64; do
            name=${entry%%:*} arch=${entry#*:}
            sbom=sbom/rootfs-rootfs-sbom-$name/$name.cdx.json
            if [ ! -s "$sbom" ]; then
              echo "::error::no SBOM of the root tree $name"; fail=1
            elif ! grep -q "arch=$arch" "$sbom"; then
              echo "::error::the SBOM of $name lists no $arch package"; fail=1
            fi
          done
          exit "$fail"

  # The required check of the main-branch ruleset: green only when every job
  # above succeeded (skipped or cancelled counts as failed).
  selftest-ok:
    if: ${{ always() }}
    needs: [lint-self, lint-templates, lint-planted, scripts, gate-pass, gate-fail, node-gate-npm, node-gate-npm-tools, node-gate-bun, node-gate-fail, python-gate-pass, python-gate-fail, shell-gate-pass, shell-gate-artifact, shell-gate-fail, shell-gate-arm64, tools-arm64, security-clean, security-clean-node, security-planted, config-scan-skipped-chart, security-helm, security-rootfs, rootfs-scan-empty-tree, release-dry-run, release-dry-run-package-json, build-context-artifact, release-dry-run-build-context, release-dry-run-image-tag, assert-image-tag, provenance-sign, provenance-environment-claim, attest-fixture, attest-dry-run, assert-planted]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all self-test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

