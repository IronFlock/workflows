# Reusable: the git tag of a release that publishes several images in one run.
# Each image job calls release-image.yml with create-tag: false; this job runs
# after all of them and sets the annotated tag <tag-prefix><version> on the
# merged commit, as release-image.yml does for a single image. Outside the
# merge of a release pull request it does nothing.
#
# Callers grant
#   permissions: { contents: write }
name: release-tag

on:
  workflow_call:
    inputs:
      version-file:
        description: File holding the version (one line, without the tag prefix), or a package.json (its `version`).
        type: string
        required: true
      tag-prefix:
        type: string
        default: v
      release-branch:
        type: string
        default: main
      harness-ref:
        description: Ref of IronFlock/workflows the harness scripts are taken from.
        type: string
        default: v1
    outputs:
      tag:
        value: ${{ jobs.tag.outputs.tag }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
      - name: what this run releases
        id: version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: '"$HARNESS/scripts/release.sh" mode'
      - name: git tag ${{ steps.version.outputs.tag }}
        if: steps.version.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE=$(head -n1 <<<"$MESSAGE")
          MESSAGE=${MESSAGE% (#*)} "$HARNESS/scripts/release.sh" tag
