# Reusable: the git tag of a release. The caller's tag job `needs` every image
# job (release-image.yml, one per image) and sets the annotated tag
# <tag-prefix><version> on the merged commit once all images are in the
# registry, so a tag always means "released". Outside the merge of a release
# pull request it does nothing; on a re-run whose tag is already on this
# commit it passes.
#
# The tag ruleset admits only the IronFlock release GitHub App, so the tag is
# written with an App token. The job runs in the caller's `release`
# environment (deployments from main only), which holds the variable
# RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY.
#
# Callers grant
#   permissions: { contents: read }
#   secrets: inherit   (environment secrets reach a reusable workflow only so)
name: release-tag

on:
  workflow_call:
    inputs:
      version-file:
        description: File holding the version (one line, without the tag prefix), or a package.json (its `version`).
        type: string
        required: true
      tag-prefix:
        type: string
        default: v
      release-branch:
        type: string
        default: main
      harness-ref:
        description: Ref of IronFlock/workflows the harness scripts are taken from.
        type: string
        default: v1
    outputs:
      tag:
        value: ${{ jobs.tag.outputs.tag }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
      - name: what this run releases
        id: version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: '"$HARNESS/scripts/release.sh" mode'
      - name: release App token (contents of this repository)
        id: app
        if: steps.version.outputs.mode == 'release'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: git tag ${{ steps.version.outputs.tag }}
        if: steps.version.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE=$(head -n1 <<<"$MESSAGE")
          MESSAGE=${MESSAGE% (#*)} "$HARNESS/scripts/release.sh" tag
