# Reusable security scan: secrets, dependencies, SAST, configuration,
# licences, SBOM and (optionally) the container image.
#
# Every scanner job only reports. The `report` job reads all findings,
# applies the repository's exceptions (security/vex.openvex.json,
# .trivyignore.yaml, .gitleaks.toml / baseline) and fails when a category in
# `fail-on` has findings or a scanner job broke. Report-only = `fail-on: ""`.
#
# Callers need `permissions: contents: read, security-events: write`.
# On public repositories results also go to the Security tab (code scanning);
# private repositories without GitHub Advanced Security get the summary and
# the artifacts only.
name: security

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the Go module / package manifest the dependency and SBOM steps use.
        type: string
        default: "."
      scan-path:
        description: Path the secret, SAST, configuration and licence scans cover (repository root by default).
        type: string
        default: "."
      languages:
        description: Comma list of go, node, python (or none) for the dependency scan and SBOM.
        type: string
        default: ""
      go-version-file:
        type: string
        default: ""
      go-version:
        type: string
        default: ""
      sarif-recipe:
        description: Go only. Recipe that writes govulncheck SARIF into sarif-dir (default runs govulncheck directly).
        type: string
        default: ""
      sarif-dir:
        type: string
        default: build/sarif
      sbom-recipe:
        description: Go only. Recipe that writes CycloneDX files into sbom-dir (default runs cyclonedx-gomod).
        type: string
        default: ""
      sbom-dir:
        type: string
        default: build/sbom
      gitleaks:
        type: boolean
        default: true
      gitleaks-mode:
        description: auto (PR / pushed commits, files on schedule) or dir (files under scan-path).
        type: string
        default: auto
      gitleaks-config:
        type: string
        default: .gitleaks.toml
      gitleaks-baseline:
        type: string
        default: .gitleaks-baseline.json
      semgrep:
        type: boolean
        default: true
      semgrep-rulesets:
        description: >-
          Registry rulesets next to the IronFlock rules (space-separated). Go
          repositories whose lint runs gosec set "" to avoid duplicate findings.
        type: string
        default: p/default
      config-scan:
        description: trivy misconfiguration scan (Dockerfile, Kubernetes, Helm).
        type: boolean
        default: true
      licenses:
        type: boolean
        default: true
      image:
        description: Build the Dockerfile for linux/amd64 and scan the image.
        type: boolean
        default: false
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: "."
      build-args:
        description: Newline-separated KEY=VALUE build arguments for the image build.
        type: string
        default: ""
      image-on:
        description: Events that build and scan the image. Public repositories and release pull requests scan on pull_request too.
        type: string
        default: push,schedule,workflow_dispatch
      vex-file:
        type: string
        default: security/vex.openvex.json
      trivyignore:
        type: string
        default: .trivyignore.yaml
      fail-on:
        description: >-
          Comma list of blocking categories: secrets, vuln-critical, vuln-high,
          misconfig-high, license-forbidden, semgrep-error. Empty = report-only.
        type: string
        default: ""
      artifact-prefix:
        description: Prefix of the artifact names; set a distinct one per call when a workflow calls this more than once.
        type: string
        default: security
      code-scanning:
        description: Upload results to the Security tab on public repositories.
        type: boolean
        default: true
      harness-ref:
        type: string
        default: v1
    outputs:
      findings:
        description: JSON object with the finding count per category.
        value: ${{ jobs.report.outputs.findings }}
      blocking:
        description: Number of findings in blocking categories.
        value: ${{ jobs.report.outputs.blocking }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOVULNCHECK_VERSION: v1.9.0
  CYCLONEDX_GOMOD_VERSION: v1.12.0
  SEMGREP_VERSION: 1.182.0

jobs:
  gitleaks:
    if: inputs.gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/findings"
      - run: '"$HARNESS/scripts/install-tool.sh" gitleaks'
      - name: gitleaks
        env:
          MODE: ${{ inputs.gitleaks-mode }}
          SCAN_PATH: ${{ inputs.scan-path }}
          GL_CONFIG: ${{ inputs.gitleaks-config }}
          GL_BASELINE: ${{ inputs.gitleaks-baseline }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: '"$HARNESS/scripts/gitleaks-scan.sh" "$MODE" "$SCAN_PATH" "$RUNNER_TEMP/findings/gitleaks.sarif"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-findings-gitleaks
          path: ${{ runner.temp }}/findings
          retention-days: 90
      - id: cs
        if: always() && inputs.code-scanning && !github.event.repository.private
        run: |
          python3 -I "$HARNESS/scripts/sarif-summary.py" upload-copy --dir "$RUNNER_TEMP/findings" --out "$RUNNER_TEMP/code-scanning"
          echo "files=$(find "$RUNNER_TEMP/code-scanning" -name '*.sarif' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.cs.outputs.files > 0
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/code-scanning
          category: gitleaks

  deps:
    if: inputs.languages != '' && inputs.languages != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/findings"
      - id: go
        if: contains(inputs.languages, 'go')
        env:
          WD: ${{ inputs.working-directory }}
          GVF: ${{ inputs.go-version-file }}
        run: echo "version-file=${GVF:-$WD/go.mod}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: contains(inputs.languages, 'go')
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && steps.go.outputs.version-file || '' }}
          cache: ${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: install just (tools.lock)
        if: contains(inputs.languages, 'go') && inputs.sarif-recipe != ''
        run: '"$HARNESS/scripts/install-tool.sh" just'
      - name: govulncheck
        if: contains(inputs.languages, 'go')
        env:
          WD: ${{ inputs.working-directory }}
          RECIPE: ${{ inputs.sarif-recipe }}
          SARIF_DIR: ${{ inputs.sarif-dir }}
        run: |
          if [ -n "$RECIPE" ]; then
            (cd "$WD" && just "$RECIPE")
            cp "$SARIF_DIR"/*.sarif "$RUNNER_TEMP/findings/"
          else
            (cd "$WD" && go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" -format sarif ./... > "$RUNNER_TEMP/findings/govulncheck.sarif")
          fi
      # Installed in a step of its own: install-tool.sh extends GITHUB_PATH,
      # which takes effect from the next step on.
      - name: install osv-scanner (tools.lock)
        if: contains(inputs.languages, 'node') || contains(inputs.languages, 'python')
        run: '"$HARNESS/scripts/install-tool.sh" osv-scanner'
      - name: osv-scanner (lockfiles)
        if: contains(inputs.languages, 'node') || contains(inputs.languages, 'python')
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          set +e
          osv-scanner scan source --recursive --format sarif --output "$RUNNER_TEMP/findings/osv.sarif" "$WD"
          rc=$?
          set -e
          # 0 = clean, 1 = vulnerabilities found, 128 = no package sources found.
          case $rc in
            0 | 1) ;;
            128) echo "::warning::osv-scanner found no lockfile under $WD"; rm -f "$RUNNER_TEMP/findings/osv.sarif" ;;
            *) exit "$rc" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-findings-deps
          path: ${{ runner.temp }}/findings
          retention-days: 90
      - id: cs
        if: always() && inputs.code-scanning && !github.event.repository.private
        run: |
          python3 -I "$HARNESS/scripts/sarif-summary.py" upload-copy --dir "$RUNNER_TEMP/findings" --out "$RUNNER_TEMP/code-scanning"
          echo "files=$(find "$RUNNER_TEMP/code-scanning" -name '*.sarif' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.cs.outputs.files > 0
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/code-scanning
          category: deps

  semgrep:
    if: inputs.semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/findings"
      - name: install semgrep
        run: pipx install "semgrep==$SEMGREP_VERSION"
      - name: semgrep (registry rulesets + IronFlock rules)
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          RULESETS: ${{ inputs.semgrep-rulesets }}
        run: |
          configs=(--config "$HARNESS/semgrep/ironflock.yml")
          for ruleset in $RULESETS; do configs+=(--config "$ruleset"); done
          semgrep scan --metrics=off --disable-version-check "${configs[@]}" \
            --sarif --output "$RUNNER_TEMP/findings/semgrep.sarif" "$SCAN_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-findings-semgrep
          path: ${{ runner.temp }}/findings
          retention-days: 90
      - id: cs
        if: always() && inputs.code-scanning && !github.event.repository.private
        run: |
          python3 -I "$HARNESS/scripts/sarif-summary.py" upload-copy --dir "$RUNNER_TEMP/findings" --out "$RUNNER_TEMP/code-scanning"
          echo "files=$(find "$RUNNER_TEMP/code-scanning" -name '*.sarif' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.cs.outputs.files > 0
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/code-scanning
          category: semgrep

  sbom:
    if: inputs.languages != '' && inputs.languages != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sbom"
      - id: go
        if: contains(inputs.languages, 'go')
        env:
          WD: ${{ inputs.working-directory }}
          GVF: ${{ inputs.go-version-file }}
        run: echo "version-file=${GVF:-$WD/go.mod}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: contains(inputs.languages, 'go')
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && steps.go.outputs.version-file || '' }}
          cache: ${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: install just (tools.lock)
        if: contains(inputs.languages, 'go') && inputs.sbom-recipe != ''
        run: '"$HARNESS/scripts/install-tool.sh" just'
      - name: SBOM (Go)
        if: contains(inputs.languages, 'go')
        env:
          WD: ${{ inputs.working-directory }}
          RECIPE: ${{ inputs.sbom-recipe }}
          SBOM_DIR: ${{ inputs.sbom-dir }}
        run: |
          if [ -n "$RECIPE" ]; then
            (cd "$WD" && just "$RECIPE")
            cp "$SBOM_DIR"/*.cdx.json "$RUNNER_TEMP/sbom/"
          else
            (cd "$WD" && go mod download && go run "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$CYCLONEDX_GOMOD_VERSION" mod -licenses -json -output "$RUNNER_TEMP/sbom/sbom.cdx.json")
          fi
      - name: install trivy (tools.lock)
        if: ${{ !contains(inputs.languages, 'go') }}
        run: '"$HARNESS/scripts/install-tool.sh" trivy'
      - name: SBOM (other ecosystems)
        if: ${{ !contains(inputs.languages, 'go') }}
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          trivy fs --quiet --format cyclonedx --output "$RUNNER_TEMP/sbom/sbom.cdx.json" "$WD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-sbom
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 90

  config:
    if: inputs.config-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/findings"
      - run: '"$HARNESS/scripts/install-tool.sh" trivy'
      - name: trivy config (Dockerfile, Kubernetes, Helm)
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          TRIVYIGNORE: ${{ inputs.trivyignore }}
        run: |
          args=(--quiet --format sarif --output "$RUNNER_TEMP/findings/trivy-config.sarif")
          if [ -f "$TRIVYIGNORE" ]; then args+=(--ignorefile "$TRIVYIGNORE"); fi
          trivy config "${args[@]}" "$SCAN_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-findings-config
          path: ${{ runner.temp }}/findings
          retention-days: 90
      - id: cs
        if: always() && inputs.code-scanning && !github.event.repository.private
        run: |
          python3 -I "$HARNESS/scripts/sarif-summary.py" upload-copy --dir "$RUNNER_TEMP/findings" --out "$RUNNER_TEMP/code-scanning"
          echo "files=$(find "$RUNNER_TEMP/code-scanning" -name '*.sarif' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.cs.outputs.files > 0
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/code-scanning
          category: config

  licenses:
    if: inputs.licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/findings"
      - id: go
        if: contains(inputs.languages, 'go')
        env:
          WD: ${{ inputs.working-directory }}
          GVF: ${{ inputs.go-version-file }}
        run: echo "version-file=${GVF:-$WD/go.mod}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: contains(inputs.languages, 'go')
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && steps.go.outputs.version-file || '' }}
          cache: ${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      # trivy reads Go module licences from the module cache.
      - name: go mod download
        if: contains(inputs.languages, 'go')
        working-directory: ${{ inputs.working-directory }}
        run: go mod download
      - run: '"$HARNESS/scripts/install-tool.sh" trivy'
      - name: trivy licence scan
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          TRIVYIGNORE: ${{ inputs.trivyignore }}
        run: |
          args=(--quiet --scanners license --format json --output "$RUNNER_TEMP/findings/licenses.json")
          if [ -f "$TRIVYIGNORE" ]; then args+=(--ignorefile "$TRIVYIGNORE"); fi
          trivy fs "${args[@]}" "$SCAN_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-findings-licenses
          path: ${{ runner.temp }}/findings
          retention-days: 90

  image:
    # Pull requests of private repositories skip the build (Actions minutes),
    # except release pull requests: their title `release <name> v<x>` is held
    # to a rising version by release-intent.yml, so the image that the merge
    # publishes is scanned before the merge.
    if: >-
      inputs.image && (contains(inputs.image-on, github.event_name) ||
      (github.event_name == 'pull_request' && (!github.event.repository.private ||
      startsWith(github.event.pull_request.title, 'release '))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/findings"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Runners are amd64: one native build. Base-OS and Go-binary CVEs do not
      # depend on the architecture.
      - name: build image (linux/amd64) to a tar
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          args=(--platform linux/amd64 -f "$DOCKERFILE" -t scan:ci -o "type=docker,dest=$RUNNER_TEMP/image.tar")
          while IFS= read -r arg; do
            [ -n "$arg" ] && args+=(--build-arg "$arg")
          done <<<"$BUILD_ARGS"
          docker buildx build "${args[@]}" "$CONTEXT"
      - run: '"$HARNESS/scripts/install-tool.sh" trivy'
      - name: trivy image (vulnerabilities with a fix, secrets)
        env:
          VEX: ${{ inputs.vex-file }}
          TRIVYIGNORE: ${{ inputs.trivyignore }}
        run: |
          args=(--quiet --scanners "vuln,secret" --ignore-unfixed --format sarif --output "$RUNNER_TEMP/findings/trivy-image.sarif")
          if [ -f "$VEX" ]; then args+=(--vex "$VEX"); fi
          if [ -f "$TRIVYIGNORE" ]; then args+=(--ignorefile "$TRIVYIGNORE"); fi
          trivy image "${args[@]}" --input "$RUNNER_TEMP/image.tar"
          rm -f "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-findings-image
          path: ${{ runner.temp }}/findings
          retention-days: 90
      - id: cs
        if: always() && inputs.code-scanning && !github.event.repository.private
        run: |
          python3 -I "$HARNESS/scripts/sarif-summary.py" upload-copy --dir "$RUNNER_TEMP/findings" --out "$RUNNER_TEMP/code-scanning"
          echo "files=$(find "$RUNNER_TEMP/code-scanning" -name '*.sarif' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.cs.outputs.files > 0
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/code-scanning
          category: image

  report:
    needs: [gitleaks, deps, semgrep, sbom, config, licenses, image]
    # Runs even when a scanner job failed or timed out (it then reports the
    # scan as incomplete), but not when the whole run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      findings: ${{ steps.report.outputs.findings }}
      blocking: ${{ steps.report.outputs.blocking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-findings-*
          path: ${{ runner.temp }}/findings
      - name: summarise and apply fail-on
        id: report
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          VEX: ${{ inputs.vex-file }}
          TRIVYIGNORE: ${{ inputs.trivyignore }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          python3 -I "$HARNESS/scripts/sarif-summary.py" report --dir "$RUNNER_TEMP/findings" \
            --fail-on "$FAIL_ON" --vex "$VEX" --trivyignore "$TRIVYIGNORE" --jobs "$JOBS" \
            --summary "$GITHUB_STEP_SUMMARY" --output "$GITHUB_OUTPUT"
