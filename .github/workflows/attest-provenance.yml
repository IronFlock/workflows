# Reusable: the SLSA build provenance of the files a caller's release built,
# signed apart from the build (SLSA Build Level 3).
#
# The job runs none of the caller's code: it takes the caller's artifact as
# data, on a runner of its own, and attests it with the steps below. Its
# Sigstore certificate names this workflow as the signer, which only a job of
# this file can get. A build step of the caller, even one that holds
# id-token: write for something else, gets a certificate naming the caller's
# own workflow, so a check that pins this workflow refuses what it signed:
#
#   gh attestation verify <file> --repo <owner>/<repo> \
#     --signer-workflow IronFlock/workflows/.github/workflows/attest-provenance.yml \
#     --source-ref refs/heads/main
#
# Everything in the provenance except the files' names and digests comes from
# the job's OIDC token; SLSA lets the build supply those two. Call it after the
# last step that changes the files, and before they are published.
#
# Container images have their own provenance (release-image.yml).
#
# Callers grant
#   permissions: { contents: read, id-token: write, attestations: write }
name: attest-provenance

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the artifact of this workflow run that holds the files.
        type: string
        required: true
      subject-path:
        description: >-
          The files to attest, one glob per line, relative to the root of the
          artifact. Every line must match at least one file.
        type: string
        required: true
      dry-run:
        description: Check that the files are there and attest nothing (release pull requests).
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
      - name: every pattern matches a file
        env:
          PATTERNS: ${{ inputs.subject-path }}
        run: |
          shopt -s nullglob
          fail=0
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            # shellcheck disable=SC2206 # the pattern is there to be expanded
            files=($pattern)
            if [ "${#files[@]}" = 0 ]; then
              echo "::error::no file matches $pattern"
              fail=1
              continue
            fi
            sha256sum -- "${files[@]}"
          done <<<"$PATTERNS"
          exit "$fail"
      - name: attest the build provenance
        if: ${{ !inputs.dry-run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ inputs.subject-path }}
