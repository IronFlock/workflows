# Reusable release of a container image, run by the merge of a release pull
# request into main (a push to main whose squash-merge title is
# `release <name> <tag>`, see release-intent.yml).
#
#   verify   the version file names <tag-prefix><version> = the tag in the
#            merge title; the commit is part of the release branch (main); the
#            tag does not exist yet; the image is not in the registry yet
#            (released images are never overwritten)
#   build    one native build per platform (no QEMU), pushed by digest, with
#            BuildKit SBOM + SLSA provenance attestations attached
#   publish  one multi-arch index tagged <tag> and `latest`; SBOM artifact,
#            digest in the job summary
#
# The git tag is set afterwards by release-tag.yml (a job of its own in the
# caller, `needs` this one), so this workflow never needs write access to the
# repository: release pull requests call it as a dry run with read rights.
#
# Checks are not repeated here: the release branch is protected by a ruleset
# that only accepts pull requests whose required checks (ci-ok, security /
# report) passed, so every commit on it is green.
#
# Re-runs are safe: when the image already exists from this very commit (its
# revision label), the build is skipped (release-tag.yml then sets the tag);
# when the tag is already on this commit, nothing is left to do.
#
# Push credentials come from GCP Workload Identity Federation: no key is
# stored anywhere. The identity provider grants the publisher service account
# only to main-branch pushes (and version tags) of an allowed repository
# through this workflow, so pull requests, other branches and other workflows
# cannot push — and because the checks above live in this file, no caller can
# release without them.
#
# A pushed version tag still releases (the flow before releases on merge; the
# tag must equal the version file, and no git tag is set). Anywhere else
# (pull requests, other branches, workflow_dispatch) the workflow is a dry run:
# it verifies and builds every platform, and pushes nothing.
#
# Callers grant
#   permissions: { contents: read, id-token: write }
name: release-image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without tag, e.g. europe-docker.pkg.dev/<project>/<repo>/<name>.
        type: string
        required: true
      version-file:
        description: File holding the version (one line, without the tag prefix), or a package.json (its `version`).
        type: string
        required: true
      tag-prefix:
        type: string
        default: v
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: "."
      build-args:
        description: Newline-separated KEY=VALUE build arguments.
        type: string
        default: ""
      platforms:
        description: >-
          JSON list of {"platform": ..., "runner": ...}. Native runners per
          architecture keep builds fast; a runner of another architecture falls
          back to QEMU emulation.
        type: string
        default: '[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
      release-branch:
        description: Only commits that are part of this branch are released.
        type: string
        default: main
      latest:
        description: Also move the `latest` tag to this release.
        type: boolean
        default: true
      artifact-prefix:
        description: Prefix of this call's artifact names; required when one run calls this workflow twice.
        type: string
        default: ""
      harness-ref:
        description: Ref of IronFlock/workflows the harness scripts are taken from.
        type: string
        default: v1
      workload-identity-provider:
        description: Full resource name of the GCP workload identity provider.
        type: string
        required: true
      service-account:
        description: Publisher service account (email).
        type: string
        required: true
    outputs:
      digest:
        description: Digest of the published multi-arch index (empty in a dry run).
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        value: ${{ jobs.verify.outputs.tag }}

# No workflow-level permissions: every job names its own (contents: read,
# id-token: write), so a release pull request's dry run starts with read rights.

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.version.outputs.mode }}
      push: ${{ steps.version.outputs.push }}
      build: ${{ steps.registry.outputs.build || steps.version.outputs.build }}
      registry: ${{ steps.version.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronFlock/workflows
          ref: ${{ inputs.harness-ref }}
          path: .harness
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - name: move harness out of the workspace
        run: |
          mv .harness "$RUNNER_TEMP/harness"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
      - name: what this run releases
        id: version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          IMAGE: ${{ inputs.image }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          "$HARNESS/scripts/release.sh" mode
          mode=$(sed -n 's/^mode=//p' "$GITHUB_OUTPUT" | tail -n1)
          case "$mode" in
            tag | release) push=true; build=true ;;
            released) push=false; build=false ;;
            *) push=false; build=true ;;
          esac
          {
            echo "push=$push"
            echo "build=$build"
            echo "registry=${IMAGE%%/*}"
          } >> "$GITHUB_OUTPUT"
      - name: the commit is part of ${{ inputs.release-branch }}
        if: steps.version.outputs.push == 'true'
        env:
          BRANCH: ${{ inputs.release-branch }}
          SHA: ${{ github.sha }}
        run: |
          # fetch-depth 0 above already fetched every branch as origin/*, with
          # the checkout's credentials. A second `git fetch` would run without
          # them (persist-credentials: false) and fail on private repositories.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" >/dev/null; then
            echo "::error::origin/$BRANCH was not fetched by the checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" "origin/$BRANCH"; then
            echo "::error::commit $SHA is not part of $BRANCH — only commits merged through a pull request are released"
            exit 1
          fi
          echo "$SHA is part of $BRANCH"
      - id: auth
        if: steps.version.outputs.push == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token
          access_token_lifetime: 300s
      - name: the tag is not in the registry yet
        id: registry
        if: steps.version.outputs.push == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          REGISTRY: ${{ steps.version.outputs.registry }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
          MODE: ${{ steps.version.outputs.mode }}
          SHA: ${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$REGISTRY"
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            revisions=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Image}}' |
              jq -r '[.. | objects | select(has("Labels")) | .Labels["org.opencontainers.image.revision"] // empty] | unique | join(" ")')
            docker logout "https://$REGISTRY"
            # A re-run of this very release whose tag step failed: the image is
            # complete, only the git tag is missing.
            if [ "$MODE" = release ] && [ "$revisions" = "$SHA" ]; then
              echo "::notice::$IMAGE:$TAG was already published from $SHA: only the git tag is set"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$IMAGE:$TAG already exists (revision ${revisions:-unknown}); released images are never overwritten — release a new version"
            exit 1
          fi
          docker logout "https://$REGISTRY"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: auth
        if: needs.verify.outputs.push == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: build ${{ matrix.platform }}${{ needs.verify.outputs.push == 'true' && ' and push by digest' || ' (dry run)' }}
        id: build
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          REGISTRY: ${{ needs.verify.outputs.registry }}
          PUSH: ${{ needs.verify.outputs.push }}
          IMAGE: ${{ inputs.image }}
          PLATFORM: ${{ matrix.platform }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          BUILD_ARGS: ${{ inputs.build-args }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.tag }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          args=(--platform "$PLATFORM" -f "$DOCKERFILE"
                --label "org.opencontainers.image.source=$SOURCE_URL"
                --label "org.opencontainers.image.revision=$REVISION"
                --label "org.opencontainers.image.version=$VERSION"
                --metadata-file "$RUNNER_TEMP/metadata.json")
          while IFS= read -r arg; do
            [ -n "$arg" ] && args+=(--build-arg "$arg")
          done <<<"$BUILD_ARGS"
          if [ "$PUSH" = true ]; then
            echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$REGISTRY"
            args+=(--sbom=true --provenance=mode=max
                   --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true")
          else
            args+=(--output type=cacheonly)
          fi
          docker buildx build "${args[@]}" "$CONTEXT"
          if [ "$PUSH" = true ]; then
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
            echo "pushed $IMAGE@$digest"
            mkdir -p "$RUNNER_TEMP/digests"
            touch "$RUNNER_TEMP/digests/${digest#sha256:}"
            docker logout "https://$REGISTRY"
          fi
          echo "artifact=${ARTIFACT_PREFIX}digest-$(echo "$PLATFORM" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.verify.outputs.push == 'true'
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, build]
    if: needs.verify.outputs.push == 'true' && needs.verify.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token
          access_token_lifetime: 600s
      - name: multi-arch index ${{ needs.verify.outputs.tag }}
        id: index
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          REGISTRY: ${{ needs.verify.outputs.registry }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
          LATEST: ${{ inputs.latest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$REGISTRY"
          refs=()
          for f in "$RUNNER_TEMP"/digests/*; do refs+=("$IMAGE@sha256:$(basename "$f")"); done
          want=$(jq length <<<"$PLATFORMS")
          [ "${#refs[@]}" -eq "$want" ] || { echo "::error::expected $want platform digests, got ${#refs[@]}"; exit 1; }
          tags=(-t "$IMAGE:$TAG")
          if [ "$LATEST" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/sbom"
          docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .SBOM}}' > "$RUNNER_TEMP/sbom/sbom.spdx.json"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          docker logout "https://$REGISTRY"
          {
            echo "## Released $IMAGE:$TAG"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| index digest | \`$digest\` |"
            echo "| platforms | $(jq -r 'map(.platform) | join(", ")' <<<"$PLATFORMS") |"
            echo "| attestations | SBOM (SPDX) + SLSA provenance attached to the image |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}release-sbom
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 90
